server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
server.max-http-request-header-size=16KB
spring.application.name=prumo-backend
prumo.api-key=${BACKEND_API_KEY:}
prumo.app-origin=${APP_ORIGIN:https://evoluir-hazel.vercel.app}
prumo.strava-client-id=${STRAVA_CLIENT_ID:}
prumo.strava-client-secret=${STRAVA_CLIENT_SECRET:}
prumo.strava-session-secret=${STRAVA_SESSION_SECRET:}
